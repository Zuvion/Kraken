<!doctype html><html lang="ru"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Kraken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css?v={{ cache_bust }}"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="splashScreen" class="splash-screen">
    <canvas id="splashCanvas" class="splash-canvas"></canvas>
    
    <div class="splash-content">
      <div class="kraken-logo-wrapper">
        <div class="logo-glow"></div>
        <div class="kraken-logo">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="80" height="80">
            <circle cx="50" cy="50" r="48" fill="#F0B90B"/>
            <path d="M50 20 C35 20 25 35 25 45 C25 55 30 60 35 65 L30 80 L40 70 L45 85 L50 68 L55 85 L60 70 L70 80 L65 65 C70 60 75 55 75 45 C75 35 65 20 50 20 Z" fill="#0B0E11"/>
            <circle cx="40" cy="42" r="5" fill="#F0B90B"/>
            <circle cx="60" cy="42" r="5" fill="#F0B90B"/>
          </svg>
        </div>
      </div>
      <h1 class="splash-title">Kraken</h1>
      <p class="splash-subtitle">EXCHANGE</p>
      
      <div class="splash-progress">
        <div class="splash-progress-bar"></div>
      </div>
      
      <p class="splash-status" id="splashStatus">Connecting to market...</p>
      
      <div class="splash-error" id="splashError" style="display:none">
        <p class="splash-error-text">No connection</p>
        <button class="splash-retry-btn" onclick="location.reload()">Retry</button>
      </div>
    </div>
  </div>
  
  <div class="header">
    <div class="brand">
      <div class="kraken-header-logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <circle cx="50" cy="50" r="48" fill="#F0B90B"/>
          <path d="M50 20 C35 20 25 35 25 45 C25 55 30 60 35 65 L30 80 L40 70 L45 85 L50 68 L55 85 L60 70 L70 80 L65 65 C70 60 75 55 75 45 C75 35 65 20 50 20 Z" fill="#0B0E11"/>
          <circle cx="40" cy="42" r="5" fill="#F0B90B"/>
          <circle cx="60" cy="42" r="5" fill="#F0B90B"/>
        </svg>
      </div>
    </div>
    <div class="header-title kraken-brand">Kraken</div>
    <div class="actions">
      <button class="icon-btn" id="btnLang" title="Language">🌐</button>
      <button class="icon-btn" id="btnNotifications" title="Notifications" style="position:relative">
        🔔
        <span id="notificationBadge" style="display:none;position:absolute;top:-2px;right:-2px;background:#F6465D;color:#fff;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;padding:0 3px;line-height:14px;text-align:center"></span>
      </button>
    </div>
  </div>
  <div id="root"></div>
  <div class="navbar">
    <div class="nav-item active assets" data-tab="assets" data-i18n="nav.assets">
      <span class="nav-icon">💼</span>
      <span>Активы</span>
    </div>
    <div class="nav-item trade" data-tab="trade" data-i18n="nav.trade">
      <span class="nav-icon">📊</span>
      <span>Торговля</span>
    </div>
    <div class="nav-item referrals" data-tab="referrals" data-i18n="nav.referrals">
      <span class="nav-icon">👥</span>
      <span>Рефералы</span>
    </div>
    <div class="nav-item" data-tab="profile" id="navProfile" style="display:none">
      <span class="nav-icon">👤</span>
      <span id="navProfileLabel">Профиль</span>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="pull-indicator" id="pullIndicator">
    <span class="pull-arrow">↻</span>
    <span class="pull-text" id="pullText">Потяните для обновления</span>
  </div>
  <script>
  (function(){
    var tgw = window.Telegram && window.Telegram.WebApp;
    if (tgw && tgw.initData && tgw.initData.length > 0) {
      var s1 = document.createElement('script');
      s1.src = 'https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js';
      s1.onload = function(){
        var s2 = document.createElement('script');
        s2.src = '/static/js/app.js?t={{ cache_bust }}';
        document.body.appendChild(s2);
      };
      document.body.appendChild(s1);
    } else {
      var root = document.getElementById('root');
      var header = document.querySelector('.header');
      var navbar = document.querySelector('.navbar');
      if(root) root.style.display = 'none';
      if(header) header.style.display = 'none';
      if(navbar) navbar.style.display = 'none';
      var splash = document.getElementById('splashScreen');
      if(splash){
        splash.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center">' +
          '<div style="margin-bottom:24px">' +
            '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="80" height="80">' +
              '<circle cx="50" cy="50" r="48" fill="#F0B90B"/>' +
              '<path d="M50 20 C35 20 25 35 25 45 C25 55 30 60 35 65 L30 80 L40 70 L45 85 L50 68 L55 85 L60 70 L70 80 L65 65 C70 60 75 55 75 45 C75 35 65 20 50 20 Z" fill="#0B0E11"/>' +
              '<circle cx="40" cy="42" r="5" fill="#F0B90B"/>' +
              '<circle cx="60" cy="42" r="5" fill="#F0B90B"/>' +
            '</svg>' +
          '</div>' +
          '<h2 style="color:#EAECEF;margin:0 0 8px;font-size:22px;font-weight:700;font-family:Inter,sans-serif">Kraken Exchange</h2>' +
          '<p style="color:#848E9C;font-size:14px;line-height:1.5;margin:8px 0 24px;font-family:Inter,sans-serif">Это приложение доступно только в Telegram</p>' +
          '<a href="https://t.me/KrakenTopBot" style="display:inline-block;padding:12px 32px;background:#F0B90B;color:#0B0E11;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;font-family:Inter,sans-serif">Открыть в Telegram</a>' +
        '</div>';
        splash.style.display = 'flex';
        splash.style.alignItems = 'center';
        splash.style.justifyContent = 'center';
      }
    }
  })();
  </script>
</body></html>
